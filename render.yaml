services:
  - type: web
    name: ai-atlas-platform
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_PATH
        value: /data/atlas.db
      - key: GEMINI_API_KEY
        sync: false # Add your Gemini API Key in the Render Dashboard Env Settings
    disk:
      name: atlas-db-volume
      mountPath: /data
      sizeGB: 1
