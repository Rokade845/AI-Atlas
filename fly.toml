app = "ai-atlas-platform"
primary_region = "fra"

[build]
  # Using the built-in python buildpack
  builder = "paketobuildpacks/builder-jammy/base:latest"

[env]
  DATABASE_PATH = "/data/atlas.db"
  PORT = "8000"

[[mounts]]
  source = "atlas_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
